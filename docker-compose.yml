services:
  db:
    image: postgres:15
    container_name: cropguard_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cropguard
    ports:
      - "5433:5432" 

  pgadmin:
    image: dpage/pgadmin4
    container_name: cropguard_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db