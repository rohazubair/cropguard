services:
  prefect:
    build: .
    container_name: cropguard_prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "4200:4200"
    volumes:
      - prefect_home:/root/.prefect
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  api:
    build: .
    container_name: cropguard_api
    env_file:
      - .env
    ports:
      - "8000:8000"

  streamlit:
    build: .
    container_name: cropguard_streamlit
    env_file:
      - .env
    environment:
      CROPGUARD_API_BASE: http://api:8000
    ports:
      - "8501:8501"
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--browser.gatherUsageStats=false",
      ]
    depends_on:
      - api

  pipeline:
    profiles: ["pipeline"]
    build: .
    container_name: cropguard_pipeline
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    command: ["python", "main.py"]
    volumes:
      - cropguard_artifacts:/app/artifacts
    depends_on:
      prefect:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: cropguard_pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"

volumes:
  cropguard_artifacts:
  prefect_home:
